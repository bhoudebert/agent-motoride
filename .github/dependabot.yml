version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript below 6.1; TypeScript 7 cannot be
      # installed next to it. Lift this when typescript-eslint moves its peer range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        patterns:
          [
            "eslint",
            "@eslint/*",
            "typescript-eslint",
            "eslint-config-prettier",
            "prettier",
            "globals",
            "@commitlint/*",
            "lint-staged",
            "simple-git-hooks",
            "typescript",
            "@types/*",
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
