name: Image

# The container image of the server for several riders (Dockerfile, ADR 0027): built and started on every change that
# can break it, so a broken image is found in the pull request and not at a rider's update. It is published on a
# release (see release.yml).
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "assets/**"
      - "deploy/**"
      - ".github/workflows/image.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build the image and start it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t agent-motoride:ci .
      - name: Start it, add a rider, reach the tools
        run: |
          docker run -d --name ride -p 127.0.0.1:8788:8788 -v ridedata:/data agent-motoride:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8788/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8788/health
          out=$(docker exec ride node src/admin.ts add ci@example.org)
          token=$(echo "$out" | grep -o 'mrt_[A-Za-z0-9_-]*' | head -1)
          test -n "$token"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8788/mcp -H 'content-type: application/json' -d '{}')" = 401
          curl -fs -X POST http://127.0.0.1:8788/mcp \
            -H "Authorization: Bearer $token" -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q '"serverInfo"'
          docker exec ride node src/admin.ts list | grep -q ci@example.org
      - name: Compose file is valid
        run: |
          printf 'RIDE_DOMAIN=rides.example.org\nRIDE_SERVER_URL=https://rides.example.org\n' > /tmp/ride.env
          docker compose -f deploy/docker-compose.yml --env-file /tmp/ride.env config --quiet
