name: Specs

# Specs are the contract (docs/EVOLVING.md, ADR 0044): every spec must parse
# with a scenario per requirement, and a pull request that changes code must
# also change a spec or the docs, unless labelled `no-spec`.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Specs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # openspec from the flake's locked nixpkgs: the same version as the dev shell.
      - run: nix shell --inputs-from . nixpkgs#openspec -c openspec validate --specs --no-interactive

  spec-with-code:
    name: Spec or docs with code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A change under src/ comes with openspec/ or docs/, or the no-spec label
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NO_SPEC: ${{ contains(github.event.pull_request.labels.*.name, 'no-spec') }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          if ! grep -q '^src/' <<<"$changed"; then
            echo "No change under src/: nothing to check."
            exit 0
          fi
          if grep -qE '^(openspec|docs)/' <<<"$changed"; then
            echo "Code changes come with a spec or docs change."
            exit 0
          fi
          if [ "$NO_SPEC" = "true" ]; then
            echo "Code changes without spec or docs, accepted by the no-spec label."
            exit 0
          fi
          echo "::error::This pull request changes src/ but no file under openspec/ or docs/. Update the spec (behaviour change) or the docs, or add the no-spec label for a change with no behaviour or usage change (refactor, internal fix)."
          exit 1
