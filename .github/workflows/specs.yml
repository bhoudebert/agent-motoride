name: Specs

# Specs are the contract (docs/EVOLVING.md, ADR 0044, ADR 0058): every spec and open
# proposal must parse with a scenario per requirement, and a pull request that changes code must
# also change the spec of what it touches (a change to the docs does not count), unless it is
# justified as having no behaviour change: the `no-spec` label.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Specs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # openspec from the flake's locked nixpkgs: the same version as the dev shell.
      - run: nix shell --inputs-from . nixpkgs#openspec -c openspec validate --all --no-interactive

  spec-with-code:
    # The name stays: it is a required check on main (ADR 0044).
    name: Spec or docs with code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Deterministic checks only: no model, no secret, nothing to install (the script uses Node alone).
      # `openspec validate` is the job above. Findings are annotations on the files, and the job summary.
      - name: Review the change against the specs
        env:
          SPEC_REVIEW_NO_SPEC: ${{ contains(github.event.pull_request.labels.*.name, 'no-spec') && 'label no-spec' || '' }}
        run: >
          node scripts/spec-review.ts
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --skip-openspec --ignore-commit-lines --format github
