# For a machine that already has a reverse proxy (nginx, Traefik...) on ports 80 and 443: the server alone, published on
# the loopback address of the host only, so that only your proxy reaches it (docs/guide/self-hosting.md, "With your own nginx").
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.nginx.yml --env-file deploy/.env up -d ride
#
# `up -d ride` starts the server and not Caddy.
services:
  ride:
    ports:
      - "127.0.0.1:8788:8788"
