# agentMotoride for several riders, with HTTPS from Caddy (docs/guide/self-hosting.md).
#
#   cp deploy/.env.example deploy/.env      # set RIDE_DOMAIN and RIDE_SERVER_URL
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/docker-compose.yml exec ride node src/admin.ts add alice@example.org
#
# The image is built from this repository; to use the published one, replace `build` with
# `image: ghcr.io/bhoudebert/agent-motoride:latest`.
services:
  ride:
    build:
      context: ..
    restart: unless-stopped
    environment:
      # What `admin add` prints as the address riders connect to.
      RIDE_SERVER_URL: ${RIDE_SERVER_URL:?set RIDE_SERVER_URL, e.g. https://rides.example.org}
      # The phone's Traffic (optional): your TomTom key, and the most TomTom requests a day it may cause. Empty: no traffic.
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      # Road signs for the roadbook files (optional): your Mapillary token. Empty: limits from OpenStreetMap and guesses only.
      MAPILLARY_ACCESS_TOKEN: ${MAPILLARY_ACCESS_TOKEN:-}
      TRAFFIC_MAX_PER_DAY: ${TRAFFIC_MAX_PER_DAY:-600}
      TRAFFIC_PROVIDER: ${TRAFFIC_PROVIDER:-open-data}
      # Your own Valhalla (optional, the `valhalla` service below): http://valhalla:8002. Empty: the public server.
      VALHALLA_URL: ${VALHALLA_URL:-}
    volumes:
      # The data: a folder of your own when RIDE_DATA_PATH is set (an absolute path, owned by uid 1000), else a Docker volume.
      - ${RIDE_DATA_PATH:-ride-data}:/data
    # Not published to the host: only Caddy reaches it.
    expose:
      - "8788"

  # Your own routing engine (optional, docs/guide/self-hosting.md): `docker compose --profile valhalla up -d`, then set
  # VALHALLA_URL=http://valhalla:8002. The first start downloads the map extracts and builds the tiles (hours, a lot of memory);
  # it answers once that is done. Reached by the ride service only: nothing is published.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    profiles: ["valhalla"]
    restart: unless-stopped
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-https://download.geofabrik.de/europe/france-latest.osm.pbf https://download.geofabrik.de/europe/belgium-latest.osm.pbf}
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: ${VALHALLA_THREADS:-4}
      # Rebuilds the tiles from the extracts already on disk: it does NOT download new ones. Do not set it by hand:
      # run deploy/update-map.sh, which deletes the old extracts, rebuilds, and clears this flag.
      force_rebuild: ${VALHALLA_REBUILD:-False}
    volumes:
      - valhalla-data:/custom_files
    expose:
      - "8002"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - ride
    ports:
      - "80:80"
      - "443:443"
    environment:
      RIDE_DOMAIN: ${RIDE_DOMAIN:?set RIDE_DOMAIN, e.g. rides.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  valhalla-data:
  ride-data:
  caddy-data:
  caddy-config:
